name: Life@UCR

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v2

    - name: Update and create submodules
      run: git submodule update --init --recursive

    - name: Build the game
      run: |
        cd CS100RPG
        cmake .
        make

    - name: Run tests
      run: |
        cd CS100RPG
        ./tests

    - name: Run the game with simulated input
      run: |
        cd CS100RPG
        echo -e "1\nTestUser\nComputer Science\n4.0\nTest Input 1\nTest Input 2\nTest Input 3\nTest Input 4\nTest Input 5\n2" | ./runGame

name: Life@UCR

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v2

    - name: Update and create submodules
      run: git submodule update --init --recursive

    - name: RunTests
      run: |
        cd CS100RPG
        cmake .
        make
        ./tests

    - name: RunGame
      run: |
        cd CS100RPG
        cmake .
        make
        ./runGame
        1
        TestUser
        Computer Science
        4.0
        Test Input 1
        Test Input 2
        Test Input 3
        Test Input 4
        Test Input 5
        2
